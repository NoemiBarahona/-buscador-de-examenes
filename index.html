<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instrucciones de Preparación - Exámenes Médicos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 font-sans min-h-screen">

  <header class="bg-blue-600 text-white p-8 text-center shadow-lg">
    <h1 class="text-3xl font-bold">Guía de Preparación para tus Exámenes</h1>
    <p class="text-blue-100 mt-2 max-w-xl mx-auto">
      Encuentra fácil y rápido cómo debes prepararte antes de tu toma de muestra.
    </p>
  </header>

  <main class="max-w-3xl mx-auto p-6">
    <!-- Buscador Fijo (Sticky) -->
    <div class="sticky top-0 z-10 bg-slate-50 py-4 mb-6 border-b border-gray-200">
      <label for="searchInput" class="block text-sm font-semibold text-gray-700 mb-2">
        🔍 Busca tu examen:
      </label>
      
      <div class="flex flex-col sm:flex-row gap-3">
        <input 
          type="text" 
          id="searchInput" 
          onkeyup="filterExams()" 
          placeholder="Ej: Hemograma, 0301045, Orina..." 
          class="flex-1 p-4 text-base rounded-xl border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 bg-white"
        >
        <button 
          id="showAllBtn" 
          onclick="showAllExams()" 
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-4 rounded-xl transition-colors shadow-sm flex items-center justify-center gap-2 whitespace-nowrap"
        >
          📋 Ver todos
        </button>
      </div>
    </div>

    <!-- Contenedor de Resultados -->
    <div id="examList" class="space-y-6"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
